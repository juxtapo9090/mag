[package]
name = "mag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "mag — resident warm-pool shell runner (aerondight fork)"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
clap = { version = "4.5.37", features = ["derive"] }
libc = "0.2"
regex = "1.11"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "1.2.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
shlex = "1.3.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }